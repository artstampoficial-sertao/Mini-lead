<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Lead</title><style>body{background:#111018;color:#eee;font:16px system-ui;margin:0}main{max-width:680px;margin:8vh auto;padding:24px}h1{color:#a855f7;font-size:3rem}section{border:1px solid #49365e;border-radius:16px;padding:24px}a{color:#d8b4fe}button{padding:12px;border:0;border-radius:8px;background:#a855f7;color:#111;font-weight:bold}pre{white-space:pre-wrap}</style><main><h1>Mini Lead</h1><p>SMK-37 Pro · Violet Edition</p><section><h2>Diagnóstico USB MIDI</h2><p>Versão de desenvolvimento. Nenhuma gravação de firmware é permitida.</p><button id="connect">Detectar portas MIDI</button><pre id="status" aria-live="polite">Aguardando conexão.</pre></section><p>Projeto derivado de <a href="https://github.com/ruppert/fmini-1">FMini-1</a>. Bluetooth MIDI e instalação ainda em desenvolvimento.</p></main><script>document.getElementById('connect').onclick=async()=>{const s=document.getElementById('status');try{if(!navigator.requestMIDIAccess)throw Error('Web MIDI indisponível. Use Chrome ou Edge em HTTPS.');const m=await navigator.requestMIDIAccess();const show=()=>{s.textContent=['Entradas:',...Array.from(m.inputs.values(),p=>p.name),'Saídas:',...Array.from(m.outputs.values(),p=>p.name)].join('\n')};show();m.onstatechange=show}catch(e){s.textContent=e.message}};</script></html>
